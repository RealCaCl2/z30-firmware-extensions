[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wonder-lantern-z30"
version = "0.1.0"
description = "Experimental modular firmware host and extensions for Nikon Z30 C 1.20"
requires-python = ">=3.10"

[project.scripts]
wonder-lantern-z30 = "z30_extensions.cli:main"

[project.gui-scripts]
wonder-lantern-z30-gui = "z30_extensions.gui:main"

[project.optional-dependencies]
gui-exe = ["keystone-engine==0.9.2", "pyinstaller>=6"]  # Keystone only generates asm_cache.gz.
sound = ["keystone-engine==0.9.2"]
video = ["keystone-engine==0.9.2"]
verify = ["unicorn==2.1.4"]
timing = ["comtypes>=1.4; sys_platform == 'win32'"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"z30_extensions.platform" = ["z30_120_zero_samples.json"]
