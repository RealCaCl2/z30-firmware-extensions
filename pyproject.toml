[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "z30-firmware-extensions"
version = "0.1.0.dev0"
description = "Source-based firmware extensions for Nikon Z30 C 1.20 and Z7 C 3.80"
requires-python = ">=3.10"

[project.scripts]
z30-extensions = "z30_extensions.cli:main"

[project.optional-dependencies]
sound = ["keystone-engine==0.9.2"]
verify = ["unicorn==2.1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"z30_extensions.platform" = ["z30_120_zero_samples.json", "z7_380_zero_samples.json"]
